<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keyember</title>
  <meta name="description" content="Keyember — développeur web full-stack.">
  <meta property="og:title" content="Keyember">
  <meta property="og:description" content="Développeur web full-stack. Angular, NestJS, Docker.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#313338">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  <link rel="stylesheet" href="./assets/style.css">
</head>
<body>

  <!-- WAIFU MASCOT -->
  <div class="waifu-mascot" aria-hidden="true">
    <img src="./assets/waifu.png" alt="" draggable="false">
  </div>

  <div class="discord-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-avatar">
        <svg class="avatar-svg" viewBox="0 0 72 72" fill="none">
          <path d="M16 14.5V57.5" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
          <path d="M18 36H35.5" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
          <path d="M35.5 36L53 14.5" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M35.5 36L56 57.5" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="54.5" cy="14.5" r="4.5" fill="currentColor"/>
          <circle cx="57.5" cy="57.5" r="4.5" fill="currentColor"/>
        </svg>
        <span class="status-dot"></span>
      </div>
      <div class="sidebar-info">
        <span class="sidebar-username">Keyember</span>
        <span class="sidebar-tag">#dev</span>
      </div>
      <nav class="sidebar-nav">
        <a href="#about" class="nav-item active" data-section="about">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15v-4H7l5-8v4h4l-5 8z"/></svg>
          À propos
        </a>
        <a href="#projects" class="nav-item" data-section="projects">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M10 4H4c-1.11 0-2 .89-2 2v12c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2h-8l-2-2z"/></svg>
          Projets
        </a>
        <a href="#links" class="nav-item" data-section="links">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>
          Liens
        </a>
      </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="content">

      <!-- ABOUT -->
      <section id="about" class="section active">
        <div class="section-header">
          <h1># à-propos</h1>
        </div>
        <div class="about-card">
          <div class="about-banner"></div>
          <div class="about-body">
            <div class="about-avatar">
              <svg viewBox="0 0 72 72" fill="none">
                <path d="M16 14.5V57.5" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
                <path d="M18 36H35.5" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
                <path d="M35.5 36L53 14.5" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M35.5 36L56 57.5" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="54.5" cy="14.5" r="4.5" fill="currentColor"/>
                <circle cx="57.5" cy="57.5" r="4.5" fill="currentColor"/>
              </svg>
              <span class="about-status"></span>
            </div>
            <div class="about-meta">
              <h2>Keyember <span class="about-badge">dev</span></h2>
              <p class="about-bio">Développeur web full-stack · Angular, NestJS, Docker · Fan d'anime et de gaming 🎮</p>
              <div class="about-tags">
                <span class="tag">Frontend</span>
                <span class="tag">Backend</span>
                <span class="tag">Docker</span>
                <span class="tag">TypeScript</span>
              </div>
            </div>
          </div>
          <div class="about-cta">
            <a class="btn btn-primary" href="#projects">Voir les projets</a>
            <a class="btn btn-secondary" href="https://github.com/keyember" target="_blank" rel="noopener noreferrer">GitHub</a>
          </div>
        </div>
      </section>

      <!-- PROJECTS -->
      <section id="projects" class="section">
        <div class="section-header">
          <h1># projets</h1>
          <button class="btn btn-sm btn-accent" id="add-project-btn">+ Ajouter</button>
        </div>

        <div class="project-grid" id="project-grid">
          <!-- Généré par JS -->
        </div>

        <!-- Modal ajout/édition -->
        <div class="modal-overlay hidden" id="project-modal">
          <div class="modal">
            <h3 id="modal-title">Nouveau projet</h3>
            <form id="project-form">
              <label>Nom
                <input type="text" id="p-name" required placeholder="Mon projet">
              </label>
              <label>Description
                <textarea id="p-desc" rows="3" placeholder="Courte description..."></textarea>
              </label>
              <label>Lien
                <input type="url" id="p-url" placeholder="https://...">
              </label>
              <label>Tag
                <input type="text" id="p-tag" placeholder="NestJS, Angular...">
              </label>
              <label>Statut
                <select id="p-status">
                  <option value="live">Live</option>
                  <option value="wip">WIP</option>
                  <option value="archived">Archivé</option>
                </select>
              </label>
              <div class="modal-actions">
                <button type="button" class="btn btn-secondary" id="modal-cancel">Annuler</button>
                <button type="submit" class="btn btn-primary">Enregistrer</button>
              </div>
            </form>
          </div>
        </div>
      </section>

      <!-- LINKS -->
      <section id="links" class="section">
        <div class="section-header">
          <h1># liens</h1>
        </div>
        <div class="links-grid">
          <a class="link-card" href="https://github.com/keyember" target="_blank" rel="noopener noreferrer">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
            <span>GitHub</span>
          </a>
          <a class="link-card" href="https://discord.com" target="_blank" rel="noopener noreferrer">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057.1 18.079.11 18.1.128 18.113a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
            <span>Discord</span>
          </a>
        </div>
      </section>

    </main>
  </div>

  <script src="./assets/main.js" defer></script>
</body>
</html>
